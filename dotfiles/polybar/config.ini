; chaOS Polybar Config
[colors]
bg = #CC000000
fg = #E6007A
pink = #E6007A
magenta = #FA0079
green = #56F39A
yellow = #D3FF33
cyan = #00FFE1
purple = #552BBF
white = #FFFFFF
black = #000000
transparent = #00000000
red = #FF0000
orange = #FF6600

[bar/top]
monitor = ${env:MONITOR:}
width = 100%
height = 32
radius = 0
fixed-center = true
bottom = false
background = ${colors.bg}
foreground = ${colors.fg}
padding-left = 0
padding-right = 1
module-margin = 1
font-0 = "monospace:size=10;3"
font-1 = "Font Awesome 6 Free:style=Solid:size=10;3"
font-2 = "Font Awesome 6 Free:style=Regular:size=10;3"
font-3 = "Font Awesome 6 Brands:size=10;3"
modules-left = powermenu bspwm filesystem cpu cputemp gpu gputemp
modules-center = title
modules-right = memory power volume battery tray date
wm-restack = bspwm
cursor-click = pointer
cursor-scroll = ns-resize

[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 20

[module/powermenu]
type = custom/text
format = " PWR "
format-background = ${colors.pink}
format-foreground = ${colors.black}
click-left = rofi -show power-menu -modi power-menu:~/.config/rofi/powermenu.sh

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true
ws-icon-0 = I;1
ws-icon-1 = II;2
ws-icon-2 = III;3
ws-icon-3 = IV;4
ws-icon-4 = V;5
ws-icon-5 = VI;6
ws-icon-6 = VII;7
ws-icon-7 = VIII;8
ws-icon-8 = IX;9
ws-icon-9 = X;0
ws-icon-default = +
format = <label-state>
label-focused = %icon%
label-focused-foreground = ${colors.black}
label-focused-background = ${colors.pink}
label-focused-padding = 1
label-occupied = %icon%
label-occupied-foreground = ${colors.pink}
label-occupied-padding = 1
label-urgent = %icon%
label-urgent-foreground = ${colors.yellow}
label-urgent-padding = 1
label-empty = %icon%
label-empty-foreground = #444
label-empty-padding = 1

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
format-mounted = <label-mounted>
label-mounted = DF%percentage_used%%
format-mounted-foreground = ${colors.yellow}
format-unmounted = <label-unmounted>
label-unmounted = DF N/A
format-unmounted-foreground = ${colors.red}

[module/title]
type = internal/xwindow
format = <label>
label =  %title%
label-maxlen = 50
label-empty = chaOS
label-empty-foreground = ${colors.green}

[module/cpu]
type = internal/cpu
interval = 1
format = <label>
label = CPU %percentage:2%%
format-foreground = ${colors.cyan}

[module/cputemp]
type = custom/script
exec = ~/.config/polybar/scripts/cputemp.sh
interval = 2

[module/gpu]
type = custom/script
exec = echo "GPU $(radeontop -d- -l1 2>/dev/null | grep -o 'gpu [0-9]*' | awk '{print $2}')%"
interval = 2
format-foreground = ${colors.cyan}

[module/power]
type = custom/script
exec = sensors amdgpu-pci-0400 | grep PPT | awk '{printf "%.0fW", $2}'
interval = 2
format-foreground = ${colors.yellow}

[module/gputemp]
type = custom/script
exec = ~/.config/polybar/scripts/gputemp.sh
interval = 2

[module/btc]
type = custom/script
exec = /home/alice/.local/bin/btc-polybar
tail = true
interval = 0

[module/memory]
type = internal/memory
interval = 1
format = <label>
label = RAM %percentage_used:2%%
format-foreground = ${colors.cyan}

[module/volume]
type = internal/pulseaudio
format-volume = <ramp-volume><label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.cyan}
format-muted = <label-muted>
label-muted = VOL MUTE
label-muted-foreground = ${colors.red}
ramp-volume-0 = VOL
ramp-volume-1 = VOL
ramp-volume-2 = VOL
ramp-volume-foreground = ${colors.cyan}
click-right = pavucontrol &

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 99
poll-interval = 5
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = FULL
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.cyan}
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${colors.cyan}
animation-charging-framerate = 750
label-discharging-foreground = ${colors.green}
format-discharging-foreground = ${colors.green}
animation-discharging-0 = BAT %percentage%%
animation-discharging-0-foreground = #FF0000
animation-discharging-1 = BAT %percentage%%
animation-discharging-1-foreground = #FF3300
animation-discharging-2 = BAT %percentage%%
animation-discharging-2-foreground = #FF6600
animation-discharging-3 = BAT %percentage%%
animation-discharging-3-foreground = #FFAA00
animation-discharging-4 = BAT %percentage%%
animation-discharging-4-foreground = #FFFF00
animation-discharging-5 = BAT %percentage%%
animation-discharging-5-foreground = #AAFF00
animation-discharging-6 = BAT %percentage%%
animation-discharging-6-foreground = #66FF00
animation-discharging-7 = BAT %percentage%%
animation-discharging-7-foreground = #00FF00

[module/date]
type = internal/date
interval = 1
time = %H:%M
time-alt = %H:%M:%S
date = %a %d
date-alt = %Y-%m-%d
format =  <label>
label = %date% %time%
format-foreground = ${colors.green}

[settings]
screenchange-reload = true
pseudo-transparency = true
