; chaOS Polybar Config

[colors]
bg = #CC000000
fg = #E6007A
pink = #E6007A
magenta = #FA0079
green = #56F39A
yellow = #D3FF33
cyan = #00FFE1
purple = #552BBF
white = #FFFFFF
black = #000000
transparent = #00000000

[bar/top]
monitor = ${env:MONITOR:}
width = 100%
height = 32
radius = 0
fixed-center = true
bottom = false

background = ${colors.bg}
foreground = ${colors.fg}

padding-left = 0
padding-right = 1
module-margin = 1

font-0 = "monospace:size=10;3"
font-1 = "Font Awesome 6 Free:style=Solid:size=10;3"
font-2 = "Font Awesome 6 Free:style=Regular:size=10;3"
font-3 = "Font Awesome 6 Brands:size=10;3"

modules-left = powermenu bspwm
modules-center = title
modules-right = cpu memory pulseaudio battery tray date

wm-restack = bspwm
cursor-click = pointer
cursor-scroll = ns-resize

[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 20

[module/powermenu]
type = custom/text
content = " PWR "
content-background = ${colors.pink}
content-foreground = ${colors.black}
click-left = rofi -show power-menu -modi power-menu:~/.config/rofi/powermenu.sh

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true

ws-icon-0 = I;1
ws-icon-1 = II;2
ws-icon-2 = III;3
ws-icon-3 = IV;4
ws-icon-4 = V;5
ws-icon-5 = VI;6
ws-icon-6 = VII;7
ws-icon-7 = VIII;8
ws-icon-8 = IX;9
ws-icon-9 = X;0
ws-icon-default = +

format = <label-state>

label-focused = %icon%
label-focused-foreground = ${colors.black}
label-focused-background = ${colors.pink}
label-focused-padding = 1

label-occupied = %icon%
label-occupied-foreground = ${colors.pink}
label-occupied-padding = 1

label-urgent = %icon%
label-urgent-foreground = ${colors.yellow}
label-urgent-padding = 1

label-empty = %icon%
label-empty-foreground = #444
label-empty-padding = 1

[module/title]
type = internal/xwindow
format = <label>
label =  %title%
label-maxlen = 50
label-empty = chaOS
label-empty-foreground = ${colors.green}

[module/cpu]
type = internal/cpu
interval = 1
format = <label>
label =  %percentage:2%%
format-foreground = ${colors.cyan}

[module/memory]
type = internal/memory
interval = 1
format = <label>
label =  %percentage_used:2%%
format-foreground = ${colors.cyan}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = <ramp-volume> <label-volume>
format-volume-foreground = ${colors.yellow}
label-volume = %percentage%%

format-muted =  0%
format-muted-foreground = #666

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

click-right = pavucontrol &

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 99
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-charging-foreground = ${colors.green}
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-foreground = ${colors.magenta}
label-discharging = %percentage%%

format-full =  100%
format-full-foreground = ${colors.green}

format-low = <animation-low> <label-low>
format-low-foreground = ${colors.yellow}
label-low = %percentage%%
low-at = 15

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

animation-low-0 = 
animation-low-1 = 
animation-low-framerate = 500

[module/date]
type = internal/date
interval = 1

time = %H:%M
time-alt = %H:%M:%S
date = %a %d
date-alt = %Y-%m-%d

format =  <label>
label = %date% %time%
format-foreground = ${colors.green}

[settings]
screenchange-reload = true
pseudo-transparency = true
