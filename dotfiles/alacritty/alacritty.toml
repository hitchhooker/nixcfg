[general]
live_config_reload = true

# Add this section
[selection]
save_to_clipboard = true

[colors.bright]
black = "0x555555"
blue = "0xe6007a"
cyan = "0x00ffe1"
green = "0x56F39A"
magenta = "0x00B2FF"
red = "0x552BBF"
white = "0xFFFFFF"
yellow = "0xD3FF33"

[colors.cursor]
cursor = "0xe6007a"
text = "0x000000"

[colors.normal]
black = "0x000000"
blue = "0xe6007a"
cyan = "0x00ffe1"
green = "0x56F39A"
magenta = "0x0077ff"
red = "0x552BBF"
white = "0xFFFFFF"
yellow = "0xD3FF33"

[colors.primary]
background = "0x000000"
foreground = "0xF8229B"

[cursor]
unfocused_hollow = false
blink_interval = 750  # milliseconds
blink_timeout = 0     # never stop blinking

[cursor.style]
blinking = "On"
shape = "Block"

[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1"  # disable DPI scaling issues

[font]
size = 11.0
builtin_box_drawing = true  # faster box drawing

[font.bold]
family = "monospace"
style = "Bold"

[font.normal]
family = "monospace"
style = "Regular"

[window]
decorations = "full"
dynamic_padding = false  # static is faster
dynamic_title = false    # less overhead
opacity = 1.0
startup_mode = "Windowed"
resize_increments = true  # snap to cell grid

[window.dimensions]
columns = 84
lines = 22

[window.padding]
x = 2
y = 2

[terminal.shell]
program = "/run/current-system/sw/bin/zsh"
args = ["-l"]

[scrolling]
history = 10000
multiplier = 3

# Performance critical
[keyboard]
bindings = [
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
]

[terminal]
